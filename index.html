<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peep Poems</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=IM+Fell+English&family=Playfair+Display:wght@400&family=Lora:wght@400&family=Crimson+Pro:wght@300&family=Libre+Baskerville&family=DM+Serif+Display&family=Gilda+Display&family=Petit+Formal+Script&family=Della+Respira&family=Source+Serif+4:wght@300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blush: #fde8ef;
    --rose-light: #fbd0df;
    --rose-mid: #f8b4ca;
    --rose-deep: #e8829a;
    --rose-ink: #c45c78;
    --petal: #fff0f5;
    --white: #ffffff;
    --text: #3a2030;
    --text-muted: #9a7080;
    --paper: #fffbfc;
    --paper-line: #fce4ec;
    --shadow: rgba(196, 92, 120, 0.08);
    --shadow-hover: rgba(196, 92, 120, 0.18);
  }

  html, body {
    height: 100%;
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  
  #sidebar {
    background: var(--white);
    border-right: 1.5px solid var(--rose-light);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 2;
  }

  .sidebar-header {
    padding: 28px 22px 20px;
    border-bottom: 1px solid var(--rose-light);
  }

  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 1.7rem;
    color: var(--rose-ink);
    letter-spacing: 0.04em;
    line-height: 1;
    margin-bottom: 4px;
  }

  .logo-sub {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  .btn-new {
    display: flex;
    align-items: center;
    gap: 8px;
    width: calc(100% - 44px);
    margin: 16px 22px 0;
    padding: 10px 16px;
    background: var(--rose-ink);
    color: white;
    border: none;
    border-radius: 8px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .btn-new:hover { background: #b04d6a; transform: translateY(-1px); }
  .btn-new svg { flex-shrink: 0; }

  .search-wrap {
    padding: 14px 22px 0;
    position: relative;
  }
  .search-input {
    width: 100%;
    padding: 8px 12px 8px 32px;
    background: var(--blush);
    border: 1px solid var(--rose-light);
    border-radius: 20px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--rose-mid); }
  .search-icon {
    position: absolute;
    left: 34px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
  }

  .poem-count {
    padding: 10px 22px 6px;
    font-size: 0.68rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-family: 'Cormorant Garamond', serif;
  }

  #poem-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 20px;
  }
  #poem-list::-webkit-scrollbar { width: 4px; }
  #poem-list::-webkit-scrollbar-track { background: transparent; }
  #poem-list::-webkit-scrollbar-thumb { background: var(--rose-light); border-radius: 4px; }

  .poem-item {
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    margin-bottom: 2px;
  }
  .poem-item:hover { background: var(--blush); }
  .poem-item.active { background: var(--rose-light); }

  .poem-item-title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 0.95rem;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .poem-item-date {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.68rem;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }

  .empty-list {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem;
  }

  
  #main {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--blush);
  }


  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    position: relative;
    z-index: 1;
  }

  .welcome-card { text-align: center; }

  #welcome .big-logo {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 4rem;
    color: var(--rose-ink);
    line-height: 1;
    margin-bottom: 10px;
  }

  #welcome p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--text-muted);
  }

  
  #editor-pane, #viewer-pane {
    display: none;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  #editor-pane.active, #viewer-pane.active { display: flex; }

  
  .toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--rose-light);
    flex-shrink: 0;
  }

  .toolbar-title-input {
    flex: 1;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    color: var(--text);
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--rose-light);
    padding: 4px 0;
    outline: none;
    min-width: 0;
    transition: border-color 0.2s;
  }
  .toolbar-title-input:focus { border-color: var(--rose-ink); }
  .toolbar-title-input::placeholder { color: var(--text-muted); }

  .font-select {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem;
    color: var(--text);
    background: var(--blush);
    border: 1px solid var(--rose-light);
    border-radius: 6px;
    padding: 6px 10px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
    max-width: 170px;
  }
  .font-select:focus { border-color: var(--rose-ink); }

  .toolbar-btn {
    display: flex; align-items: center; justify-content: center;
    width: 34px; height: 34px;
    border-radius: 8px;
    border: 1px solid var(--rose-light);
    background: var(--white);
    color: var(--rose-ink);
    cursor: pointer;
    transition: background 0.15s, border-color 0.2s;
    flex-shrink: 0;
  }
  .toolbar-btn:hover { background: var(--blush); border-color: var(--rose-mid); }
  .toolbar-btn.danger:hover { background: #fff0f2; border-color: #f8a0b0; color: #c04060; }
  .toolbar-btn.save { background: var(--rose-ink); border-color: var(--rose-ink); color: white; }
  .toolbar-btn.save:hover { background: #b04d6a; }

  
  .paper-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 40px 60px;
    display: flex;
    justify-content: center;
    background: var(--blush);
  }
  .paper-wrap::-webkit-scrollbar { width: 5px; }
  .paper-wrap::-webkit-scrollbar-thumb { background: var(--rose-light); border-radius: 4px; }

  .paper {
    width: 100%;
    max-width: 520px;
    min-height: 640px;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 4px 30px var(--shadow), 0 1px 8px var(--shadow);
    position: relative;
    overflow: hidden;
    padding: 52px 52px 52px 80px;
  }

  .paper::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        transparent,
        transparent 31px,
        var(--paper-line) 31px,
        var(--paper-line) 32px
      );
    background-position: 0 52px;
    pointer-events: none;
    opacity: 0.55;
  }
  .paper::after {
    content: '';
    position: absolute;
    left: 66px; top: 0; bottom: 0;
    width: 1.5px;
    background: rgba(248, 180, 202, 0.45);
    pointer-events: none;
  }

  #poem-editor {
    width: 100%;
    min-height: 540px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-size: 1rem;
    line-height: 32px;
    color: var(--text);
    position: relative;
    z-index: 1;
    white-space: pre-wrap;
    word-break: break-word;
    caret-color: var(--rose-ink);
    font-family: 'Cormorant Garamond', serif;
  }

  .edit-meta {
    padding: 8px 28px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-align: right;
    flex-shrink: 0;
    background: var(--blush);
  }

  
  .viewer-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--rose-light);
    flex-shrink: 0;
  }

  .viewer-title {
    flex: 1;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    color: var(--text);
  }

  .viewer-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 40px 60px;
    display: flex;
    justify-content: center;
    background: var(--blush);
  }
  .viewer-wrap::-webkit-scrollbar { width: 5px; }
  .viewer-wrap::-webkit-scrollbar-thumb { background: var(--rose-light); border-radius: 4px; }

  .viewer-paper {
    width: 100%;
    max-width: 520px;
    min-height: 640px;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 4px 30px var(--shadow);
    padding: 52px 52px 52px 80px;
    position: relative;
    overflow: hidden;
  }
  .viewer-paper::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        transparent,
        transparent 31px,
        var(--paper-line) 31px,
        var(--paper-line) 32px
      );
    background-position: 0 52px;
    pointer-events: none;
    opacity: 0.45;
  }
  .viewer-paper::after {
    content: '';
    position: absolute;
    left: 66px; top: 0; bottom: 0;
    width: 1.5px;
    background: rgba(248, 180, 202, 0.4);
    pointer-events: none;
  }

  #poem-display {
    position: relative;
    z-index: 1;
    font-size: 1rem;
    line-height: 32px;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .viewer-meta {
    padding: 8px 28px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    text-align: right;
    flex-shrink: 0;
    background: var(--blush);
  }

  
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(58, 32, 48, 0.25);
    backdrop-filter: blur(3px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: white;
    border-radius: 16px;
    padding: 36px 40px;
    max-width: 340px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(58, 32, 48, 0.15);
    text-align: center;
  }

  .modal h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-weight: 400;
    margin-bottom: 10px;
    color: var(--text);
  }

  .modal p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem;
    color: var(--text-muted);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .btn-cancel {
    padding: 9px 22px;
    border-radius: 8px;
    border: 1px solid var(--rose-light);
    background: white;
    color: var(--text-muted);
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-cancel:hover { background: var(--blush); }

  .btn-delete {
    padding: 9px 22px;
    border-radius: 8px;
    border: none;
    background: #e05070;
    color: white;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-delete:hover { background: #c04060; }

  
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: white;
    padding: 10px 22px;
    border-radius: 20px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    z-index: 200;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">

  
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">Peep Poems</div>
      <div class="logo-sub">your little poem shelf</div>
    </div>

    <button class="btn-new" onclick="newPoem()">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New Poem
    </button>

    <div class="search-wrap" style="padding-top:14px">
      <svg class="search-icon" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="search-input" placeholder="search poems…" oninput="filterPoems(this.value)">
    </div>

    <div class="poem-count" id="poem-count">0 poems</div>
    <div id="poem-list"></div>
  </aside>

  
  <main id="main">

    
    <div id="welcome">
      <div class="welcome-card">
        <div class="big-logo">Peep Poems</div>
        <p>pick a poem or write something new</p>
      </div>
    </div>

    
    <div id="editor-pane">
      <div class="toolbar">
        <input class="toolbar-title-input" id="title-input" placeholder="untitled poem…" spellcheck="false">
        <select class="font-select" id="font-select" onchange="updateEditorFont()">
          <option value="'Cormorant Garamond', serif">Cormorant Garamond</option>
          <option value="'IM Fell English', serif">IM Fell English</option>
          <option value="'Playfair Display', serif">Playfair Display</option>
          <option value="'Lora', serif">Lora</option>
          <option value="'Crimson Pro', serif">Crimson Pro</option>
          <option value="'Libre Baskerville', serif">Libre Baskerville</option>
          <option value="'DM Serif Display', serif">DM Serif Display</option>
          <option value="'Gilda Display', serif">Gilda Display</option>
          <option value="'Della Respira', serif">Della Respira</option>
          <option value="'Source Serif 4', serif">Source Serif 4</option>
          <option value="'Petit Formal Script', cursive">Petit Formal Script</option>
        </select>
        <button class="toolbar-btn save" title="Save poem" onclick="savePoem()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        </button>
        <button class="toolbar-btn" title="View poem" onclick="viewCurrentPoem()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="toolbar-btn danger" title="Delete poem" onclick="confirmDelete()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
      <div class="paper-wrap">
        <div class="paper">
          <textarea id="poem-editor" placeholder="write your poem here…" spellcheck="false" oninput="markDirty()"></textarea>
        </div>
      </div>
      <div class="edit-meta" id="edit-meta"></div>
    </div>

    
    <div id="viewer-pane">
      <div class="viewer-toolbar toolbar">
        <div class="viewer-title" id="viewer-title"></div>
        <button class="toolbar-btn" title="Edit poem" onclick="editCurrentPoem()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="toolbar-btn danger" title="Delete poem" onclick="confirmDelete()">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        </button>
      </div>
      <div class="viewer-wrap">
        <div class="viewer-paper">
          <div id="poem-display"></div>
        </div>
      </div>
      <div class="viewer-meta" id="viewer-meta"></div>
    </div>

  </main>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Delete this poem?</h3>
    <p>This can't be undone. The poem will vanish like a whisper.</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Keep it</button>
      <button class="btn-delete" onclick="deletePoem()">Delete</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>

const STORAGE_KEY = 'peep_index';
const POEM_PREFIX = 'peep_poem_';

function getIndex() { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
function saveIndex(idx) { localStorage.setItem(STORAGE_KEY, JSON.stringify(idx)); }
function readPoem(id) { const r = localStorage.getItem(POEM_PREFIX + id); return r ? JSON.parse(r) : null; }
function writePoem(poem) { localStorage.setItem(POEM_PREFIX + poem.id, JSON.stringify(poem)); }
function removePoem(id) { localStorage.removeItem(POEM_PREFIX + id); saveIndex(getIndex().filter(i => i !== id)); }

let currentId = null, dirty = false, searchQuery = '';

function init() { renderList(); showWelcome(); }

function renderList() {
  const poems = getIndex().map(id => readPoem(id)).filter(Boolean);
  poems.sort((a, b) => a.updatedAt - b.updatedAt);
  const q = searchQuery.trim().toLowerCase();
  const filtered = q ? poems.filter(p => p.title.toLowerCase().includes(q) || p.body.toLowerCase().includes(q)) : poems;

  document.getElementById('poem-count').textContent = filtered.length + (filtered.length === 1 ? ' poem' : ' poems');

  const list = document.getElementById('poem-list');
  if (!filtered.length) {
    list.innerHTML = `<div class="empty-list">${q ? 'no poems match your search' : 'no poems yet — write one!'}</div>`;
    return;
  }
  list.innerHTML = filtered.map(p => `
    <div class="poem-item ${p.id === currentId ? 'active' : ''}" onclick="openPoem('${p.id}')">
      <div class="poem-item-title">${escHtml(p.title || 'untitled')}</div>
      <div class="poem-item-date">${fmtDate(p.updatedAt)}</div>
    </div>`).join('');
}

function filterPoems(q) { searchQuery = q; renderList(); }

function openPoem(id) {
  if (dirty && currentId && !confirm('You have unsaved changes. Discard them?')) return;
  currentId = id; dirty = false;
  const poem = readPoem(id);
  if (!poem) return;
  showViewer(poem);
  renderList();
}

function showViewer(poem) {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('editor-pane').classList.remove('active');
  document.getElementById('viewer-pane').classList.add('active');

  document.getElementById('viewer-title').textContent = poem.title || 'untitled';
  const display = document.getElementById('poem-display');
  display.textContent = poem.body;
  display.style.fontFamily = poem.font || "'Cormorant Garamond', serif";
  document.getElementById('viewer-meta').textContent = 'last edited · ' + fmtDateFull(poem.updatedAt);
}

function editCurrentPoem() {
  if (!currentId) return;
  const poem = readPoem(currentId);
  if (poem) showEditor(poem);
}

function showEditor(poem) {
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('viewer-pane').classList.remove('active');
  document.getElementById('editor-pane').classList.add('active');

  document.getElementById('title-input').value = poem.title || '';
  document.getElementById('poem-editor').value = poem.body || '';

  const fontSel = document.getElementById('font-select');
  fontSel.value = poem.font || "'Cormorant Garamond', serif";
  document.getElementById('poem-editor').style.fontFamily = fontSel.value;
  document.getElementById('edit-meta').textContent = poem.updatedAt ? 'last edited · ' + fmtDateFull(poem.updatedAt) : '';
  dirty = false;
}

function viewCurrentPoem() {
  if (dirty) { showToast('save first ✦'); return; }
  if (!currentId) return;
  const poem = readPoem(currentId);
  if (poem) showViewer(poem);
}

function newPoem() {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  const id = 'poem_' + Date.now();
  const poem = { id, title: '', body: '', font: "'Cormorant Garamond', serif", createdAt: Date.now(), updatedAt: Date.now() };
  writePoem(poem);
  const idx = getIndex(); idx.push(id); saveIndex(idx);
  currentId = id; dirty = false;
  showEditor(poem); renderList();
  setTimeout(() => document.getElementById('title-input').focus(), 50);
}

function savePoem() {
  if (!currentId) return;
  const poem = { ...readPoem(currentId), id: currentId,
    title: document.getElementById('title-input').value.trim() || 'untitled',
    body:  document.getElementById('poem-editor').value,
    font:  document.getElementById('font-select').value,
    updatedAt: Date.now() };
  writePoem(poem);
  dirty = false;
  document.getElementById('edit-meta').textContent = 'last edited · ' + fmtDateFull(poem.updatedAt);
  renderList(); showToast('poem saved ✦');
}

function markDirty() { dirty = true; }

function confirmDelete() { if (currentId) document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function deletePoem() {
  closeModal();
  if (!currentId) return;
  removePoem(currentId); currentId = null; dirty = false;
  showWelcome(); renderList(); showToast('poem removed');
}

function updateEditorFont() {
  document.getElementById('poem-editor').style.fontFamily = document.getElementById('font-select').value;
  markDirty();
}

function showWelcome() {
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('editor-pane').classList.remove('active');
  document.getElementById('viewer-pane').classList.remove('active');
}

function fmtDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
function fmtDateFull(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }) +
    ' · ' + d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    if (document.getElementById('editor-pane').classList.contains('active')) savePoem();
  }
});

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

init();
</script>
</body>
</html>
